{% extends "base.html" %}

{% block title %}Domain Details - AI Research Intelligence{% endblock %}

{% block content %}
<div class="mb-6">
    <h1 class="text-3xl font-bold mb-2">Domain Details</h1>
    <p class="text-gray-600">History and timeline for domain: <span id="domain-label" class="font-medium">{{ domain_id }}</span></p>
    <a href="{{ url_for('network') }}" class="text-indigo-600 hover:text-indigo-800 text-sm font-medium">&larr; Back to Network</a>
</div>

<div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
    <div class="px-6 py-4 border-b border-gray-200">
        <h2 class="text-lg font-semibold" id="domain-title">Loading...</h2>
        <p class="text-sm text-gray-500" id="domain-type">Type: loading...</p>
    </div>
    <div class="p-6">
        <div class="space-y-6" id="domain-runs">
            <!-- Domain run history will be populated here -->
        </div>
    </div>
</div>

<div class="mt-6 bg-white rounded-lg shadow-sm border border-gray-200 p-6">
    <h3 class="text-lg font-semibold mb-4">Timeline</h3>
    <div class="h-64 border-l-2 border-indigo-200 pl-4" id="domain-timeline">
        <!-- Timeline will be populated here -->
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const DOMAIN_ID = '{{ domain_id }}';
const DOMAIN_API = '/api/domain/' + DOMAIN_ID;

async function loadDomainHistory() {
    const res = await fetch(DOMAIN_API);
    const history = await res.json();
    
    document.getElementById('domain-title').textContent = history.label || DOMAIN_ID;
    document.getElementById('domain-type').textContent = 'Type: ' + history.domain_type;
    document.getElementById('domain-label').textContent = history.label || DOMAIN_ID;
    
    const runsContainer = document.getElementById('domain-runs');
    const timelineContainer = document.getElementById('domain-timeline');
    
    if (history.runs.length === 0) {
        runsContainer.innerHTML = '<p class="text-gray-500 text-center py-8">No run history found for this domain.</p>';
        return;
    }
    
    history.runs.forEach((run, index) => {
        const runEl = document.createElement('div');
        runEl.className = 'border-b border-gray-100 pb-4 last:border-0';
        runEl.innerHTML = `
            <div class="flex justify-between items-start mb-2">
                <div>
                    <h4 class="font-semibold text-gray-900">Run ${run.run_id.slice(0,8)}...</h4>
                    <p class="text-sm text-gray-500">${run.timestamp.slice(0,16)}</p>
                </div>
                <div class="text-right">
                    <span class="bg-indigo-100 text-indigo-700 px-2 py-1 rounded text-xs font-medium">${run.source_count} sources</span>
                </div>
            </div>
            <div class="flex flex-wrap gap-2">
                ${run.topics.map(t => `<span class="bg-gray-100 text-gray-700 px-2 py-1 rounded text-xs">${t}</span>`).join('')}
            </div>
            ${run.related_candidates && run.related_candidates.length > 0 ? `
            <div class="mt-3 pl-4 border-l-2 border-gray-200">
                <p class="text-xs font-medium text-gray-600 mb-2">Related Candidates:</p>
                <ul class="space-y-1">
                    ${run.related_candidates.map(c => `<li class="text-sm">
                        <a href="/run/${c.candidate_id}" class="text-indigo-600 hover:underline">${c.title.slice(0,60)}...</a>
                        <span class="ml-2 text-xs text-gray-500">${c.assessment} (${c.score}/100)</span>
                    </li>`).join('')}
                </ul>
            </div>
            ` : ''}
        `;
        runsContainer.appendChild(runEl);
        
        // Timeline entry
        const tlEl = document.createElement('div');
        tlEl.className = 'relative mb-8 last:mb-0';
        tlEl.innerHTML = `
            <div class="absolute -left-[9px] top-1 w-3 h-3 rounded-full bg-indigo-500 border border-white"></div>
            <div class="ml-1">
                <p class="text-sm font-medium text-gray-900">${run.timestamp.slice(0,10)}</p>
                <p class="text-xs text-gray-500">${run.topics.join(', ')}</p>
            </div>
        `;
        timelineContainer.appendChild(tlEl);
    });
}

loadDomainHistory();
</script>
{% endblock %}
